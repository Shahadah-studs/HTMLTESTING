<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>New webpage</title>
    </head>
    <body>
<!-- START OF 100% INLINE COOKIE CONSENT BANNER (NO STYLE OR SCRIPT TAGS) -->
<div id="paia-cookie-container" style="position: fixed; bottom: 24px; right: 24px; width: calc(100% - 48px); max-width: 420px; background-color: #ffffff; color: #1f2937; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); border: 1px solid #e5e7eb; z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; opacity: 0; transform: translateY(40px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none;">
  
  <!-- Invisible trigger to run JavaScript inline without script tags -->
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="display:none;" onerror="
    var container = document.getElementById('paia-cookie-container');
    if (!localStorage.getItem('paia_cookie_consent')) {
      setTimeout(function() {
        container.style.opacity = '1';
        container.style.transform = 'translateY(0)';
        container.style.pointerEvents = 'auto';
      }, 800);
    }
  ">

  <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #111827; display: flex; align-items: center; gap: 8px;">
    🍪 Cookie & Privacy Settings
  </div>
  
  <p style="font-size: 14px; line-height: 1.5; color: #4b5563; margin: 0 0 20px 0;">
    We use essential background scripts and fonts to ensure our prayer schedules and community features load smoothly. By clicking "Accept All", you consent to our site's standard optimization tools.
  </p>
  
  <div style="display: flex; justify-content: flex-end; gap: 12px;">
    <button id="paia-cookie-decline" 
            style="padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; background-color: transparent; color: #4b5563; border: 1px solid #d1d5db;" 
            onmouseover="this.style.backgroundColor='#f9fafb'; this.style.color='#1f2937';" 
            onmouseout="this.style.backgroundColor='transparent'; this.style.color='#4b5563';"
            onclick="
              localStorage.setItem('paia_cookie_consent', 'essential_only');
              var c = document.getElementById('paia-cookie-container');
              c.style.opacity = '0'; c.style.transform = 'translateY(40px)'; c.style.pointerEvents = 'none';
            ">
      Essential Only
    </button>
    <button id="paia-cookie-accept" 
            style="padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; background-color: #047857; color: #ffffff; border: none;" 
            onmouseover="this.style.backgroundColor='#065f46';" 
            onmouseout="this.style.backgroundColor='#047857';"
            onclick="
              localStorage.setItem('paia_cookie_consent', 'all_accepted');
              var c = document.getElementById('paia-cookie-container');
              c.style.opacity = '0'; c.style.transform = 'translateY(40px)'; c.style.pointerEvents = 'none';
            ">
      Accept All
    </button>
  </div>
</div>
<!-- END OF 100% INLINE COOKIE CONSENT BANNER -->


    </body>
</html>
